[package]
name = "hls-proxy"
version = "0.1.0"
edition = "2021"
description = "An HLS reverse proxy that forwards custom headers to every segment and emulates Chrome's TLS (JA3/JA4) fingerprint"
authors = ["Hamaad Raza"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/hamaadraza/hls-proxy"
homepage = "https://github.com/hamaadraza/hls-proxy"
keywords = ["hls", "proxy", "m3u8", "streaming", "tls-fingerprint"]
categories = ["command-line-utilities", "multimedia::video", "web-programming"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
wreq = { version = "5.3", features = ["stream", "gzip", "brotli", "zstd", "deflate", "json", "cookies"] }
wreq-util = { version = "2.2", features = ["emulation", "emulation-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dotenvy = "0.15"
url = "2"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
