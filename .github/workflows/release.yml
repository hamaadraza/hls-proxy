name: Release

# Tag a commit to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# workflow_dispatch builds the artifacts without publishing unless it is run
# from a tag ref, so you can rehearse the build safely.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # One failing target must not silently drop the others.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # oldest supported image => widest glibc compatibility
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel # macos-13 was retired; this is the Intel image
          - target: aarch64-apple-darwin
            os: macos-14 # Apple silicon
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          # BoringSSL's Windows assembly path is x86-only, so this one builds
          # the portable C backend. Marked experimental: if the image or
          # toolchain regresses it will not block the rest of the release.
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev

      # Only x86_64 Windows benefits: BoringSSL uses NASM for x86/x86_64 only.
      # Leaving NASM off the arm64 image is deliberate -- the cmake shim then
      # selects the portable C backend, which is the path that actually builds.
      - name: Install NASM (Windows x64, enables the assembly build)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          } else {
            choco install llvm -y --no-progress
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          }

      # No build cache here on purpose: releases are built clean.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="hls-proxy-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"

          strip "target/${{ matrix.target }}/release/hls-proxy" || true
          cp "target/${{ matrix.target }}/release/hls-proxy" "dist/${STAGE}/"
          cp README.md .env.example "dist/${STAGE}/"
          if [ -f LICENSE ]; then cp LICENSE "dist/${STAGE}/"; fi

          cd dist
          tar czf "${STAGE}.tar.gz" "${STAGE}"

          # sha256sum on Linux; macOS ships shasum instead.
          if command -v sha256sum > /dev/null; then
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi

          echo "packaged ${STAGE}.tar.gz"

      # Compress-Archive and Get-FileHash are built into PowerShell, so this
      # needs nothing preinstalled on the image (7-Zip is not guaranteed on the
      # arm64 Windows runner).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Stage = "hls-proxy-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$Stage" | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/hls-proxy.exe" "dist/$Stage/"
          Copy-Item "README.md", ".env.example" "dist/$Stage/"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$Stage/" }

          Compress-Archive -Path "dist/$Stage" -DestinationPath "dist/$Stage.zip"

          # Same "<hash>  <file>" layout as sha256sum, so `sha256sum -c` works.
          $Hash = (Get-FileHash "dist/$Stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Stage.zip" | Out-File -Encoding ascii "dist/$Stage.zip.sha256"

          Write-Host "packaged $Stage.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    # Only ever publish from a tag.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
